# Rubble suite: the rough_v1 field made hard. Every one of the 32 baked boxes is live, 20 mm tall (rough_v1: 24
# at 12 mm), 5 cm across, 7 cm apart on a 0.5 m wide strip, any yaw: the feet cannot find bare floor between
# them, so the swing has to clear a 20 mm edge (standing height 47 mm) instead of shuffling round it.
# Seeds differ only in the spawn offset (spawn_jitter_m), so 20 episodes meet different rocks on the SAME field.
# UNCALIBRATED (0.1.0): the firmware trot is expected to be degenerate here (its swing clears 0.7 mm);
# replay it with `python -m trainer.eval.baselines --suite rubble_v1`. Distance / progress are design targets
# (half the rough_v1 champion's 0.60 m); falls and stumbles follow rough_v1 with a wider margin.
suite: rubble_v1
version: 0.1.0-uncalibrated
include: [_servo_safety]
protocol:
  n_episodes: 20
  seed_start: 0
  episode_seconds: 10.0
  command: [0.12, 0.0, 0.0]
  model: bittle_cpu_terrain.xml
  dr: nominal
  terrain:
    kind: rough
    n_boxes: 32
    box_height_m: 0.020
    box_size_m: 0.05
    box_spacing_m: 0.07
    box_yaw_deg: [-90.0, 90.0]
    field_start_m: 0.15
    field_width_m: 0.50
    field_seed: 17
    spawn_jitter_m: 0.06
gates:
  - name: fall_rate
    metric: fall_rate
    op: "<="
    threshold: 0.15
    unit: fraction
    term: orientation
    hint: "raise orientation / base_height penalties; lower box_height_m and warm-start again"
  - name: forward_distance_p50
    metric: forward_distance_p50
    op: ">="
    threshold: 0.35
    unit: m
    term: tracking_lin_vel
    hint: "the field is 2.2 m of 20 mm rocks; ideal is 1.2 m at 0.12 m/s for 10 s"
  - name: progress_ratio
    metric: progress_ratio
    op: ">="
    threshold: 0.30
    unit: ratio
    term: tracking_lin_vel
    hint: "distance / (commanded speed x seconds); the robot is stuck on edges (read stuck_x)"
  - name: vel_tracking_rmse
    metric: vel_tracking_rmse
    op: "<="
    threshold: 0.10
    unit: m/s
    term: tracking_lin_vel
    hint: "tighten tracking_sigma or raise tracking_lin_vel"
  - name: stumble_rate
    metric: stumble_rate
    op: "<="
    threshold: 0.25
    unit: fraction
    term: stumble
    hint: "fraction of steps with a shank/thigh on a rock: raise the stumble penalty 10-100x and foot_clearance"
  - name: foot_clearance
    metric: foot_clearance_p50_mm
    op: ">="
    threshold: 12.0
    unit: mm
    term: foot_clearance
    hint: "median swing-foot peak above the local terrain; the rocks are 20 mm, a 12 mm swing still catches every edge"
  - name: body_clearance
    metric: body_clearance_min_mm
    op: ">="
    threshold: 12.0
    unit: mm
    term: base_height
    hint: "minimum torso height above the mean level under the feet; raise base_height penalty"
  - name: heading_drift_lateral
    metric: lateral_drift_m
    op: "<="
    threshold: 0.20
    unit: m
    term: tracking_lin_vel
    hint: "penalise lateral velocity via tracking_lin_vel (vy=0)"
  - name: beats_baseline_trot_distance
    metric: baseline_distance_ratio
    op: ">="
    threshold: 1.1
    unit: ratio
    group: baseline
    term: tracking_lin_vel
    hint: "the firmware trot replayed on the same rubble is the bar (skipped when the trot cannot cross it)"
