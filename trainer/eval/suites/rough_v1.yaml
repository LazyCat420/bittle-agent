# Rocks / edges suite: a fixed field of 24 half-buried 12 mm boxes (seeded layout), flat gravity.
# Seeds differ only in the spawn offset (spawn_jitter_m), so 20 episodes meet different rocks on
# the SAME field. UNCALIBRATED until `baselines --suite rough_v1` has replayed the firmware trot.
suite: rough_v1
version: 0.1.0-uncalibrated
include: [_servo_safety]
protocol:
  n_episodes: 20
  seed_start: 0
  episode_seconds: 10.0
  command: [0.12, 0.0, 0.0]
  model: bittle_cpu_terrain.xml
  dr: nominal
  terrain:
    kind: rough
    n_boxes: 24
    box_height_m: 0.012
    box_size_m: 0.035
    box_spacing_m: 0.10
    field_start_m: 0.15
    field_width_m: 0.40
    field_seed: 11
    spawn_jitter_m: 0.06
gates:
  - name: fall_rate
    metric: fall_rate
    op: "<="
    threshold: 0.25
    unit: fraction
    term: orientation
    hint: "raise orientation / base_height penalties; lower box_height_m and warm-start again"
  - name: forward_distance_p50
    metric: forward_distance_p50
    op: ">="
    threshold: 0.45
    unit: m
    term: tracking_lin_vel
    hint: "raise tracking_lin_vel; ideal is 1.2 m at 0.12 m/s for 10 s"
  - name: progress_ratio
    metric: progress_ratio
    op: ">="
    threshold: 0.40
    unit: ratio
    term: tracking_lin_vel
    hint: "distance / (commanded speed x seconds); the robot is getting stuck on edges"
  - name: vel_tracking_rmse
    metric: vel_tracking_rmse
    op: "<="
    threshold: 0.08
    unit: m/s
    term: tracking_lin_vel
    hint: "tighten tracking_sigma or raise tracking_lin_vel"
  - name: stumble_rate
    metric: stumble_rate
    op: "<="
    threshold: 0.15
    unit: fraction
    term: stumble
    hint: "fraction of steps with a shank/thigh on the ground: raise the stumble penalty 10-100x and foot_clearance"
  - name: foot_clearance
    metric: foot_clearance_p50_mm
    op: ">="
    threshold: 8.0
    unit: mm
    term: foot_clearance
    hint: "median swing-foot height above the local terrain; raise the foot_clearance penalty (target 12 mm)"
  - name: body_clearance
    metric: body_clearance_min_mm
    op: ">="
    threshold: 15.0
    unit: mm
    term: base_height
    hint: "minimum torso height above the local terrain; raise base_height penalty"
  - name: heading_drift_lateral
    metric: lateral_drift_m
    op: "<="
    threshold: 0.20
    unit: m
    term: tracking_lin_vel
    hint: "penalise lateral velocity via tracking_lin_vel (vy=0)"
  - name: beats_baseline_trot_distance
    metric: baseline_distance_ratio
    op: ">="
    threshold: 1.1
    unit: ratio
    group: baseline
    term: tracking_lin_vel
    hint: "the firmware trot replayed on the same rocks is the bar (skipped when the trot cannot cross them)"
