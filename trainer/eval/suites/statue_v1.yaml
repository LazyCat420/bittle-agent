# Statue: zero command, shoved every ~2 s at 0.5 m/s; must not fall, must not wander, must re-level.
# The push is applied as a base velocity kick (the same mechanism as dr.push_enabled in training).
# CALIBRATED 2026-09-07 (1.0.0) against the open-loop `stand` controller under this exact push schedule,
# 20 episodes: drift 0.021 m, 0 falls, tilt 0.27 deg, rms vz 0.010, energy 0.001 W (10/10 gates). Every
# threshold below sits at >= 2x the stand's number; the firmware trot under the same shoves drifts 0.89 m.
suite: statue_v1
version: 1.0.0
include: [_servo_safety]
protocol:
  n_episodes: 20
  seed_start: 0
  episode_seconds: 10.0
  command: [0.0, 0.0, 0.0]
  model: bittle_cpu.xml
  dr: nominal
  push:
    vel: 0.5
    interval_s: 2.0
  terrain:
    kind: flat
gates:
  - name: push_recovery_falls
    metric: fall_rate
    op: "<="
    threshold: 0.0
    unit: fraction
    term: orientation
    hint: "a shove must never topple the robot: raise orientation / base_height, let it re-step (feet_air_time 0)"
  - name: total_drift
    metric: centre_drift_m
    op: "<="
    threshold: 0.10
    unit: m
    term: stand_still
    hint: "the robot may re-step but must come back: raise stand_still"
  - name: body_stability_tilt
    metric: mean_tilt_deg
    op: "<="
    threshold: 6.0
    unit: deg
    term: orientation
    hint: "raise orientation penalty (the unpushed stand settles at 0 deg)"
  - name: body_stability_vz
    metric: rms_vz
    op: "<="
    threshold: 0.05
    unit: m/s
    term: lin_vel_z
    hint: "raise lin_vel_z penalty"
  - name: stand_still_falls
    metric: stand_still_falls
    op: "<="
    threshold: 0
    unit: count
    term: stand_still
    hint: "the unpushed stand must hold"
