# Pirouette: turn in place at a commanded 0.5 rad/s without drifting. Flat ground, same XML as flat_v1.
# The Bittle has no abduction joint, so spinning is foot scrub by construction — the task config lowers
# feet_slip. UNCALIBRATED: no firmware skill spins in place. `opencat_trL` (the firmware TURN) replayed on this
# protocol, 20 episodes: yaws 87 deg in 10 s (0.15 rad/s, rmse 0.64 vs the 0.5 command) while drifting 0.44 m,
# 0 falls, 3.0 W — a curve, not a spin. Thresholds are design targets until a learned policy shows what is achievable.
suite: spin_v1
version: 0.1.0-uncalibrated
include: [_servo_safety]
protocol:
  n_episodes: 20
  seed_start: 0
  episode_seconds: 10.0
  command: [0.0, 0.0, 0.5]
  model: bittle_cpu.xml
  dr: nominal
  terrain:
    kind: flat
gates:
  - name: spin_rate_rmse
    metric: ang_vel_rmse
    op: "<="
    threshold: 0.10
    unit: rad/s
    term: tracking_ang_vel
    hint: "raise tracking_ang_vel or loosen ang_tracking_sigma; the firmware turn manages ~0.15 rad/s"
  - name: centre_drift
    metric: centre_drift_m
    op: "<="
    threshold: 0.08
    unit: m
    term: tracking_lin_vel
    hint: "the torso must stay put: with vx=vy=0 commanded, tracking_lin_vel penalises translation"
  - name: fall_rate
    metric: fall_rate
    op: "<="
    threshold: 0.10
    unit: fraction
    term: orientation
    hint: "raise orientation / base_height penalties"
  - name: body_stability_tilt
    metric: mean_tilt_deg
    op: "<="
    threshold: 10.0
    unit: deg
    term: orientation
    hint: "raise orientation penalty"
  - name: stand_still_falls
    metric: stand_still_falls
    op: "<="
    threshold: 0
    unit: count
    term: stand_still
    hint: "zero command must hold still"
