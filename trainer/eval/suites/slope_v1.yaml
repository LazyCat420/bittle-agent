# Incline suite: walk UP a fixed 8-degree slope (tilted-world protocol; same XML as flat).
# CALIBRATED 2026-09-07 (1.0.0) against the firmware gaits replayed on this exact protocol, 20 episodes
# (`python -m trainer.eval.baselines --suite slope_v1`): opencat_trF 0.497 m, climb 0.069 m, 0 falls,
# 3.68 W, lateral 0.007 m, tilt 5.3 deg, peak joint speed 4.07 rad/s; opencat_wkF 0.653 m, 2.97 W.
# Rule: distance = 1.1 x trot; climb = distance x sin(8 deg); falls = trot + 0.10; energy = 0.5 x trot
# (ratio gate) with the 2.0 W fragment cap; tilt/lateral/vz keep a 2x margin over the trot.
suite: slope_v1
version: 1.0.0
include: [_servo_safety]
protocol:
  n_episodes: 20
  seed_start: 0
  episode_seconds: 10.0
  command: [0.10, 0.0, 0.0]
  model: bittle_cpu.xml
  dr: nominal
  terrain:
    kind: slope
    slope_deg: 8.0        # scalar: a suite is a fixed bar, whatever the run trained on
    slope_yaw_deg: 0.0
    spawn_jitter_m: 0.0
gates:
  - name: fall_rate
    metric: fall_rate
    op: "<="
    threshold: 0.10
    unit: fraction
    term: orientation
    hint: "the trot never falls here (baseline + 0.10); raise orientation / base_height penalties; lower the slope_deg range and warm-start again"
  - name: forward_distance_p50
    metric: forward_distance_p50
    op: ">="
    threshold: 0.55
    unit: m
    term: tracking_lin_vel
    hint: "1.1 x the firmware trot's 0.497 m on this slope; ideal is 1.0 m at 0.10 m/s for 10 s"
  - name: climb_height
    metric: climb_height_p50
    op: ">="
    threshold: 0.076
    unit: m
    term: tracking_lin_vel
    hint: "= 0.55 m x sin(8 deg) (the trot climbs 0.069 m); turn on slope_progress (reward) if tracking alone stalls"
  - name: vel_tracking_rmse
    metric: vel_tracking_rmse
    op: "<="
    threshold: 0.07
    unit: m/s
    term: tracking_lin_vel
    hint: "tighten tracking_sigma or raise tracking_lin_vel"
  - name: heading_drift_lateral
    metric: lateral_drift_m
    op: "<="
    threshold: 0.20
    unit: m
    term: tracking_lin_vel
    hint: "sliding sideways off the fall line is the slope failure mode; penalise lateral velocity"
  - name: body_stability_tilt
    metric: mean_tilt_deg
    op: "<="
    threshold: 12.0
    unit: deg
    term: orientation
    hint: "tilt is measured against the terrain normal; raise orientation penalty"
  - name: body_stability_vz
    metric: rms_vz
    op: "<="
    threshold: 0.06
    unit: m/s
    term: lin_vel_z
    hint: "raise lin_vel_z penalty"
  - name: energy_vs_baseline
    metric: baseline_energy_ratio
    op: "<="
    threshold: 0.5
    unit: ratio
    group: baseline
    term: energy
    hint: "at most half the firmware trot's 3.68 W on this slope (climbing 8 deg at 0.10 m/s is ~0.04 W of mechanical work)"
  - name: beats_baseline_trot_distance
    metric: baseline_distance_ratio
    op: ">="
    threshold: 1.1
    unit: ratio
    group: baseline
    term: tracking_lin_vel
    hint: "the firmware trot replayed on the same slope is the bar (skipped when the trot cannot climb at all)"
  - name: stand_still_falls
    metric: stand_still_falls
    op: "<="
    threshold: 0
    unit: count
    term: stand_still
    hint: "standing on the slope must not fall"
